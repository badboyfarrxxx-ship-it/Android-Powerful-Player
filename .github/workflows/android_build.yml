name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Media Player APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Build VPN APK
      run: ./gradlew :vpn:assembleDebug --no-daemon

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: android-apks
        path: |
          app/build/outputs/apk/debug/*.apk
          vpn/build/outputs/apk/debug/*.apk
